name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: ling-box-linux-x86-64
          - os: linux
            arch: arm64
            artifact_name: ling-box-linux-arm64
          - os: windows
            arch: amd64
            artifact_name: ling-box-windows-x86-64.exe
          - os: darwin
            arch: amd64
            artifact_name: ling-box-macos-x86-64
          - os: darwin
            arch: arm64
            artifact_name: ling-box-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "Current tag: $CURRENT_TAG"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          echo "Previous tag: $PREVIOUS_TAG"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating notes from $PREVIOUS_TAG to $CURRENT_TAG"
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Linux (x86-64)**: ling-box-linux-x86-64" >> release_notes.md
          echo "- **Linux (ARM64)**: ling-box-linux-arm64" >> release_notes.md
          echo "- **Windows (x86-64)**: ling-box-windows-x86-64.exe" >> release_notes.md
          echo "- **macOS (x86-64)**: ling-box-macos-x86-64" >> release_notes.md
          echo "- **macOS (ARM64)**: ling-box-macos-arm64" >> release_notes.md

          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/ling-box-linux-x86-64/ling-box-linux-x86-64 release/
          cp artifacts/ling-box-linux-arm64/ling-box-linux-arm64 release/
          cp artifacts/ling-box-windows-x86-64.exe/ling-box-windows-x86-64.exe release/
          cp artifacts/ling-box-macos-x86-64/ling-box-macos-x86-64 release/
          cp artifacts/ling-box-macos-arm64/ling-box-macos-arm64 release/
          chmod +x release/*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            release/ling-box-linux-x86-64
            release/ling-box-linux-arm64
            release/ling-box-windows-x86-64.exe
            release/ling-box-macos-x86-64
            release/ling-box-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
