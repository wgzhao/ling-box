name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Native cgo builds: MuPDF is statically linked from go-fitz's bundled libs.
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/wgzhao/ling-box/cmd.version=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # No cgo on Windows: no bundled MuPDF, the pdf command is unavailable.
            CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" -o lingbox.exe .
            7z a "lingbox-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" lingbox.exe
            echo "asset=lingbox-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" >> "$GITHUB_ENV"
          else
            CGO_ENABLED=1 go build -trimpath -ldflags "${LDFLAGS}" -o lingbox .
            tar -czf "lingbox-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" lingbox
            echo "asset=lingbox-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **Linux (x86-64 / ARM64)**: lingbox-${CURRENT_TAG#v}-linux-*.tar.gz"
            echo "- **macOS (x86-64 / ARM64)**: lingbox-${CURRENT_TAG#v}-darwin-*.tar.gz"
            echo "- **Windows (x86-64)**: lingbox-${CURRENT_TAG#v}-windows-amd64.zip"
          } > release_notes.md
          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
