name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}/${{ matrix.arch }}
    # Build natively on each platform so CGO stays enabled and MuPDF is
    # statically linked from go-fitz's bundled libs. Cross-compiling
    # disables CGO, which switches go-fitz to its purego loader and makes
    # the binary depend on a runtime libmupdf (panic at startup without it).
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runs_on: ubuntu-latest
            artifact_name: lingbox-linux-x86-64
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
            artifact_name: lingbox-linux-arm64
          - os: windows
            arch: amd64
            runs_on: windows-latest
            artifact_name: lingbox-windows-x86-64.exe
          - os: darwin
            arch: amd64
            runs_on: macos-15-intel
            artifact_name: lingbox-macos-x86-64
          - os: darwin
            arch: arm64
            runs_on: macos-15
            artifact_name: lingbox-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        shell: bash
        run: go build -trimpath -ldflags="-s -w -X github.com/wgzhao/ling-box/cmd.version=${{ github.ref_name }}" -o ${{ matrix.artifact_name }} .

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            ./${{ matrix.artifact_name }} --version
          else
            chmod +x ${{ matrix.artifact_name }}
            ./${{ matrix.artifact_name }} --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "Current tag: $CURRENT_TAG"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          echo "Previous tag: $PREVIOUS_TAG"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating notes from $PREVIOUS_TAG to $CURRENT_TAG"
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Linux (x86-64)**: lingbox-linux-x86-64" >> release_notes.md
          echo "- **Linux (ARM64)**: lingbox-linux-arm64" >> release_notes.md
          echo "- **Windows (x86-64)**: lingbox-windows-x86-64.exe" >> release_notes.md
          echo "- **macOS (x86-64)**: lingbox-macos-x86-64" >> release_notes.md
          echo "- **macOS (ARM64)**: lingbox-macos-arm64" >> release_notes.md

          cat release_notes.md

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/lingbox-linux-x86-64/lingbox-linux-x86-64 release/
          cp artifacts/lingbox-linux-arm64/lingbox-linux-arm64 release/
          cp artifacts/lingbox-windows-x86-64.exe/lingbox-windows-x86-64.exe release/
          cp artifacts/lingbox-macos-x86-64/lingbox-macos-x86-64 release/
          cp artifacts/lingbox-macos-arm64/lingbox-macos-arm64 release/
          chmod +x release/*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            release/lingbox-linux-x86-64
            release/lingbox-linux-arm64
            release/lingbox-windows-x86-64.exe
            release/lingbox-macos-x86-64
            release/lingbox-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
