name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v -o lingbox .

      - name: Test
        run: go test -v ./...

      - name: Upload launcher E2E artifacts
        uses: actions/upload-artifact@v7
        with:
          name: launcher-e2e
          path: |
            test/e2e/artifacts
            contrib/alfred/dist
            contrib/utools/dist
          if-no-files-found: ignore
