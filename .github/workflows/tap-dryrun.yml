name: Tap dry run

# Exercises the Homebrew tap update from release.yml without publishing a
# release. Takes an already-published tag, downloads its assets, and runs the
# same push-formula.sh that the release job runs -- the only difference is the
# branch it lands on.
#
# The tap's default branch is never touched: everything goes to dryrun/<tag>,
# which is meant to be inspected and then deleted. The branch is removed and
# recreated on every run so repeats are not rejected as non-fast-forward.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sync the formula to'
        required: true
        default: 'v0.8.1'

permissions:
  contents: read

jobs:
  dryrun:
    name: Dry-run tap update for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          for asset in lingbox-macos-arm64 lingbox-macos-x86-64 lingbox-linux-arm64 lingbox-linux-x86-64; do
            gh release download "${{ inputs.tag }}" --pattern "$asset" --dir release --clobber
          done
          ls -l release

      - name: Update tap on a scratch branch
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "awk in use: $(readlink -f "$(command -v awk)")"

          TAP_DIR="$RUNNER_TEMP/tap"
          BRANCH="dryrun/${TAG}"

          git clone --depth 1 https://github.com/wgzhao/homebrew-tap.git "$TAP_DIR"
          git -C "$TAP_DIR" remote set-url origin \
            "https://x-access-token:${TAP_TOKEN}@github.com/wgzhao/homebrew-tap.git"
          git -C "$TAP_DIR" push origin --delete "$BRANCH" 2>/dev/null || true

          ./.github/scripts/push-formula.sh "$TAG" release "$TAP_DIR" "$BRANCH"
